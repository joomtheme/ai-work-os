name: Mission kernel
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: workos
          POSTGRES_PASSWORD: workos
          POSTGRES_DB: workos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://workos:workos@localhost:5432/workos_test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - run: npm run test:http
      - name: Verify the isolated Docker runner
        run: |
          docker pull node:24-bookworm-slim
          TEST_DOCKER_IMAGE=$(docker image inspect node:24-bookworm-slim --format '{{index .RepoDigests 0}}') node --import tsx --test tests/docker.test.ts
